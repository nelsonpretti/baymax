<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>robot face</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

  #shell {
    position: relative; width: 100%; height: 100%;
    /* NOT an OS drag region: a drag region swallows mouse events, and the face
       has to know when you click it. Dragging is done by hand in renderer.js. */
    -webkit-app-region: no-drag;
    border: 1.5px solid transparent;
    border-radius: 12px;
    transition: border-color .15s ease, background .15s ease;
  }
  /* The window is transparent, so hovering has to reveal where its edges are. */
  #shell:hover {
    border-color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.05);
  }
  /* The canvas keeps the face's own size. When the settings open the WINDOW
     grows to the right and the panel lives in the new strip, so the panel
     never sits on top of the face. */
  #stage { display: block; position: absolute; top: 0; left: 0; }

  #gear {
    -webkit-app-region: no-drag;
    position: absolute; top: 8px;
    /* only shows when you are actually over the window */
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease, color .18s ease, background .18s ease;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1 -apple-system, sans-serif;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.24);
    border: 1px solid rgba(255,255,255,0.42);
    border-radius: 7px;
    cursor: pointer; user-select: none;
  }
  #shell:hover #gear, #shell.panel-open #gear { opacity: 1; pointer-events: auto; }
  #gear:hover { color: #fff; background: rgba(255,255,255,0.38); }

  #panel {
    -webkit-app-region: no-drag;
    position: absolute; top: 8px;
    width: 204px; padding: 12px;
    display: none;
    background: rgba(18,18,20,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    font: 11px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    color: rgba(255,255,255,0.74);
    backdrop-filter: blur(12px);
  }
  #panel.open { display: block; }
  #panel label { display: block; margin-bottom: 9px; }
  #panel .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #panel input[type=color] { width: 30px; height: 20px; padding: 0; border: none; background: none; cursor: pointer; }
  #panel input[type=range] { width: 88px; accent-color: #d8d8d8; }
  #panel input[type=checkbox] { accent-color: #6ee7b7; }
  #panel .val { min-width: 30px; text-align: right; color: rgba(255,255,255,0.45); font-variant-numeric: tabular-nums; }
  #panel hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 0; }
  #panel button {
    width: 100%; padding: 5px; cursor: pointer;
    background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.10); border-radius: 6px;
    font: 11px -apple-system, sans-serif;
  }
  #panel button:hover { background: rgba(255,255,255,0.16); color: #fff; }
  #panel button#quit:hover { background: rgba(255,80,80,0.16); }
  #panel button + button { margin-top: 6px; }
</style>
</head>
<body>
<div id="shell">
  <canvas id="stage"></canvas>
  <div id="gear" title="Settings">&#9881;</div>
  <div id="panel">
    <label class="row"><span>Eyes &amp; mouth</span><input type="color" id="accentColor"></label>
    <label class="row"><span>Stripes</span><input type="color" id="bandColor"></label>
    <label class="row"><span>Screen</span><input type="color" id="screenColor"></label>
    <label class="row"><span>Body</span><input type="color" id="chassisColor"></label>
    <label class="row"><span>Mood colours</span><input type="checkbox" id="moodColours"></label>
    <hr>
    <label class="row"><span>Background</span><input type="color" id="bgColor"></label>
    <label class="row"><span>Opacity</span><input type="range" id="bgOpacity" min="0" max="1" step="0.05"><span class="val" id="bgOpacityVal"></span></label>
    <hr>
    <label class="row"><span>Voice lag</span><input type="range" id="voiceLead" min="0" max="0.8" step="0.01"><span class="val" id="voiceLeadVal"></span></label>
    <hr>
    <label class="row"><span>Width</span><input type="range" id="width" min="180" max="620" step="10"><span class="val" id="widthVal"></span></label>
    <label class="row"><span>Height</span><input type="range" id="height" min="200" max="700" step="10"><span class="val" id="heightVal"></span></label>
    <hr>
    <button id="hotkey">Voice shortcut: …</button>
    <button id="resetColours">Reset colours</button>
    <button id="demo">Demo reactions</button>
    <button id="quit">Close face</button>
  </div>
</div>
<script src="src/robot.js"></script>
<script src="src/renderer.js"></script>
</body>
</html>
